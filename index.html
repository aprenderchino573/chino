<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学中文">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Chino · 3 palabras cada 12 h</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#1f1b16; --muted:#7a7166; --line:#e6dccb;
  --accent:#b8322a; --accent-soft:#f3dcd6; --ok:#2f7d4f; --ok-soft:#dcefe2;
  --hz:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16130f; --card:#211d18; --ink:#f1ebe0; --muted:#a39888; --line:#352f27;
    --accent:#e0675c; --accent-soft:#3c2320; --ok:#6cc08d; --ok-soft:#1f3328; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,var(--hz);}
#app{max-width:560px;margin:0 auto;min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 24px);
  display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
.brand{font-family:var(--hz);font-size:22px;font-weight:600;letter-spacing:.02em}
.brand small{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.today h2{margin:0 0 6px;font-size:18px}
.today p{margin:0;color:var(--muted)}
.big{display:block;width:100%;padding:16px;border-radius:16px;background:var(--accent);color:#fff;
  font-weight:600;font-size:17px;margin-top:16px}
.big:active{transform:scale(.99)}
.big.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.links{display:flex;gap:10px;margin-top:14px}
.links button{flex:1;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:500}
.note{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.warn{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}

/* sesión */
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;font-weight:600}
.kind.new{color:var(--accent)}
.word{text-align:center;padding:6px 0 14px;border-bottom:1px dashed var(--line);margin-bottom:16px}
.word .h{font-family:var(--hz);font-size:64px;line-height:1.1}
.word .p{font-size:20px;color:var(--accent);margin-top:4px}
.word .m{font-size:17px;margin-top:2px}
.sent{font-family:var(--hz);font-size:28px;line-height:1.9;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:2px 4px;padding:6px 0}
.tok{border-radius:8px;padding:0 3px}
.tok:active{background:var(--line)}
.tok.tg{background:var(--accent-soft);color:var(--accent)}
.punct{padding:0 1px}
ruby{ruby-position:over}
rt{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;color:var(--muted);letter-spacing:0}
.hidep rt{visibility:hidden}
.tr{text-align:center;font-size:17px;margin-top:10px}
.gloss{text-align:center;font-size:15px;color:var(--muted);margin-top:6px}
.gloss b{color:var(--ink);font-family:var(--hz)}
.play{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.center{text-align:center;margin-top:12px}
.reveal{margin-top:18px;width:100%;padding:16px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:16px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.grade button{padding:16px;border-radius:16px;font-weight:600;font-size:16px}
.again{background:var(--accent-soft);color:var(--accent)}
.good{background:var(--ok-soft);color:var(--ok)}
.spacer{flex:1}

/* hoja de palabra */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 22px calc(env(safe-area-inset-bottom) + 22px);text-align:center}
.sheet .h{font-family:var(--hz);font-size:48px}
.sheet .p{color:var(--accent);font-size:19px}
.sheet .m{margin:4px 0 14px}

/* listas */
h1.title{font-size:20px;margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.row .h{font-family:var(--hz);font-size:26px;min-width:64px}
.row .t{flex:1;min-width:0}
.row .t div:first-child{color:var(--accent);font-size:14px}
.row .t div:last-child{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:12px;color:var(--muted);white-space:nowrap}
.set{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.opt label{display:block;font-weight:600;margin-bottom:8px}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.switch{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.tg-sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.2s}
.tg-sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg-sw.on{background:var(--ok)}
.tg-sw.on::after{left:23px}
input[type=range]{width:100%;accent-color:var(--accent)}
.danger{color:var(--accent);font-weight:600;padding:12px;border-radius:12px;border:1px solid var(--line);width:100%}
.done{text-align:center;padding:30px 0}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;margin-top:8px}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.msg{font-size:13px;margin-top:6px;color:var(--ok)}
.done .h{font-family:var(--hz);font-size:56px}
</style>
</head>

  if (!ok) {
    sess.stats.fail++;
    const pos = Math.min(sess.queue.length, sess.i + 3 + Math.floor(Math.random() * 4));
    sess.queue.splice(pos, 0, {type: c.type === "review" ? "relearn" : c.type, w: c.w});
    sess.total++;
  }
  save(); next();
}
function finish() {
  const t = today();
  if (state.lastActive !== t) { state.streak = state.lastActive === t - 1 ? (state.streak || 0) + 1 : 1; state.lastActive = t; }
  save();
  view = "done"; render();
}

/* ---------- render ---------- */
const ICON = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  close: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  gear: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  sound: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'
};

function sentenceHTML(si, target, hideP) {
  const ids = S[si][0], py = tokenPinyin(ids);
  const toks = ids.map((id, k) => typeof id === "number"
    ? `<span class="tok${id === target ? " tg" : ""}" data-w="${id}"><ruby>${esc(W[id][0])}<rt>${esc(py[k])}</rt></ruby></span>`
    : `<span class="punct"><ruby>${esc(id)}<rt>&nbsp;</rt></ruby></span>`).join("");
  return `<div class="sent${hideP ? " hidep" : ""}">${toks}</div>`;
}

function render() {
  if (view === "home") return renderHome();
  if (view === "session") return renderSession();
  if (view === "done") return renderDone();
  if (view === "vocab") return renderVocab();
  if (view === "settings") return renderSettings();
}

function renderHome() {
  const due = dueList().length, nw = plannedNew().length, known = learnedIds().length;
  const voiceWarn = ("speechSynthesis" in window) ? (zhVoice || !speechSynthesis.getVoices().length ? "" :
    `<div class="warn">Tu navegador no tiene voz en chino instalada; el audio puede sonar mal. En el iPhone: Ajustes › Accesibilidad › Contenido leído › Voces › Chino.</div>`) :
    `<div class="warn">Este navegador no permite reproducir audio de voz.</div>`;
  let title, sub;
  if (nw && due) { title = `${due} repaso${due > 1 ? "s" : ""} y ${nw} palabras nuevas`; sub = "Primero repasas, luego aprendes las nuevas."; }
  else if (nw) { title = `${nw} palabras nuevas`; sub = state.nextBatch === 0 ? "Primer día: 10 palabras básicas para empezar a formar frases." : "Cada una dentro de una frase útil."; }
  else if (due) { title = `${due} repaso${due > 1 ? "s" : ""} pendiente${due > 1 ? "s" : ""}`; sub = state.nextBatch >= NBATCH ? "Has completado el temario." : `Próximas palabras nuevas en ${horas(nextLessonAt() - Date.now())}.`; }
  else { title = "Todo hecho por ahora"; sub = state.nextBatch >= NBATCH ? "Has completado todo el temario." : `Próximas palabras nuevas en ${horas(nextLessonAt() - Date.now())}.`; }
  const main = (nw || due)
    ? `<button class="big" id="go">Empezar</button>`
    : (known ? `<button class="big ghost" id="free">Práctica libre (sin afectar al calendario)</button>` : "");
  $app.innerHTML = `
    <div class="top"><div class="brand">学中文<small>3 palabras cada 12 h</small></div>
      <button class="iconbtn" id="set" aria-label="Ajustes">${ICON.gear}</button></div>
    ${voiceWarn}
    <div class="stats">
      <div class="stat"><b>${known}</b><span>palabras</span></div>
      <div class="stat"><b>${state.streak || 0}</b><span>días seguidos</span></div>
      <div class="stat"><b>${W.length - known}</b><span>por aprender</span></div>
    </div>
    <div class="card today"><h2>${title}</h2><p>${sub}</p>${main}</div>
    <div class="links"><button id="voc">Vocabulario</button>${(nw || due) && known ? '<button id="free">Práctica libre</button>' : ""}</div>
    <div class="note">Toca cualquier palabra de una frase para ver su pinyin y su significado.</div>`;
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on("go", () => { startSession(false); autoplayCard(); });
  on("free", () => { startSession(true); autoplayCard(); });
  on("voc", () => { view = "vocab"; render(); });
  on("set", () => { view = "settings"; confirmReset = false; render(); });
}

function renderSession() {
  const c = sess.queue[sess.i], w = W[c.w], si = sess.sent;
  const pct = Math.round(sess.i / sess.total * 100);
  const labels = {new: "Palabra nueva", check: "Comprueba la nueva", review: "Repaso", relearn: "Otra vez", free: "Práctica libre"};
  let body;
  if (c.type === "new") {
    body = `<div class="kind new">${labels.new}</div>
      <div class="word"><div class="h">${esc(w[0])}</div><div class="p">${esc(w[1])}</div><div class="m">${esc(w[2])}</div></div>
      ${sentenceHTML(si, c.w, false)}
      <div class="tr">${esc(S[si][1])}</div>
      <div class="center"><button class="play" id="play">${ICON.sound} Escuchar</button></div>
      <div class="spacer"></div>
      <button class="big" id="next">Siguiente</button>`;
  } else {
    const showP = sess.revealed || state.pinyinFirst;
    body = `<div class="kind">${labels[c.type]}</div>
      <div class="card">
        ${sentenceHTML(si, c.w, !showP)}
        ${sess.revealed ? `<div class="tr">${esc(S[si][1])}</div>
          <div class="gloss"><b>${esc(w[0])}</b> ${esc(w[1])} · ${esc(w[2])}</div>` : ""}
        <div class="center"><button class="play" id="play">${ICON.sound} Escuchar</button></div>
      </div>
      <div class="spacer"></div>
      ${sess.revealed
        ? `<div class="grade"><button class="again" id="no">Otra vez</button><button class="good" id="ok">Lo sabía</button></div>`
        : `<button class="reveal" id="rev">¿Entiendes la frase? Toca para ver la traducción</button>`}`;
  }
  $app.innerHTML = `
    <div class="top"><button class="iconbtn" id="x" aria-label="Salir">${ICON.close}</button>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div style="font-size:13px;color:var(--muted);min-width:44px;text-align:right">${sess.i + 1}/${sess.total}</div></div>
    ${body}`;
  bindTokens();
  document.getElementById("x").onclick = () => { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} view = "home"; sess = null; render(); };
  document.getElementById("play").onclick = () => speak(sentText(S[si][0]));
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on("next", next);
  on("rev", () => { sess.revealed = true; render(); autoplayCard(); });
  on("ok", () => answer(true));
  on("no", () => answer(false));
}

function bindTokens() {
  $app.querySelectorAll(".tok").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const id = +el.dataset.w; speak(W[id][0]); openSheet(id);
  });
}
function openSheet(id) {
  closeSheet();
  const w = W[id];
  const d = document.createElement("div");
  d.className = "sheet-bg";
  d.innerHTML = `<div class="sheet"><div class="h">${esc(w[0])}</div><div class="p">${esc(w[1])}</div><div class="m">${esc(w[2])}</div>
    <button class="play" id="sp">${ICON.sound} Escuchar</button></div>`;
  d.onclick = ev => { if (ev.target === d) closeSheet(); };
  d.querySelector("#sp").onclick = () => speak(w[0]);
  document.body.appendChild(d); sheet = d;
}
function closeSheet() { if (sheet) { sheet.remove(); sheet = null; } }

function renderDone() {
  const st = sess ? sess.stats : {review: 0, fail: 0};
  const n = sess ? sess.newCount : 0;
  const parts = [];
  if (n) parts.push(`${n} palabras nuevas`);
  if (st.review) parts.push(`${st.review} repasos`);
  $app.innerHTML = `
    <div class="done"><div class="h">很好！</div><p style="font-size:18px;margin:8px 0 4px">Sesión terminada</p>
      <p style="color:var(--muted);margin:0">${parts.join(" · ") || "Práctica completada"}${st.fail ? ` · ${st.fail} fallos repetidos` : ""}</p></div>
    <div class="stats">
      <div class="stat"><b>${learnedIds().length}</b><span>palabras</span></div>
      <div class="stat"><b>${state.streak || 0}</b><span>días seguidos</span></div>
      <div class="stat"><b>${dueTomorrow()}</b><span>repasos en 24 h</span></div>
    </div>
    <button class="big" id="home">Volver</button>`;
  sess = null;
  document.getElementById("home").onclick = () => { view = "home"; render(); };
}
const dueTomorrow = () => learnedIds().filter(id => { const L = state.learned[id]; return L.dueAt ? L.dueAt <= Date.now() + 2 * H12 : L.due <= today() + 1; }).length;

function horas(ms) {
  const m = Math.max(1, Math.ceil(ms / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}`;
}
function whenLabel(due, dueAt) {
  if (dueAt) return dueAt <= Date.now() ? "ahora" : `en ${horas(dueAt - Date.now())}`;
  const d = due - today();
  if (d <= 0) return "hoy"; if (d === 1) return "mañana"; if (d < 30) return `en ${d} días`;
  return `en ${Math.round(d / 30)} mes${Math.round(d / 30) > 1 ? "es" : ""}`;
}
function renderVocab() {
  const ids = learnedIds().sort((a, b) => b - a);
  $app.innerHTML = `
    <div class="top"><button class="iconbtn" id="b">${ICON.back}</button><h1 class="title">Vocabulario · ${ids.length}</h1><div style="width:40px"></div></div>
    <div class="list">${ids.length ? ids.map(id => `<button class="row" data-w="${id}">
      <div class="h">${esc(W[id][0])}</div><div class="t"><div>${esc(W[id][1])}</div><div>${esc(W[id][2])}</div></div>
      <div class="d">${whenLabel(state.learned[id].due, state.learned[id].dueAt)}</div></button>`).join("")
      : `<p class="note">Aún no has aprendido palabras.</p>`}</div>`;
  document.getElementById("b").onclick = () => { view = "home"; render(); };
  $app.querySelectorAll(".row").forEach(r => r.onclick = () => { const id = +r.dataset.w; speak(W[id][0]); openSheet(id); });
}

function renderSettings() {
  const seg = [1, 2, 3].map(n => `<button data-n="${n}" class="${state.perDay === n ? "on" : ""}">${n * 3}</button>`).join("");
  const voice = !("speechSynthesis" in window) ? "No disponible en este navegador"
    : zhVoice ? `Voz: ${esc(zhVoice.name)}` : "No se ha encontrado voz china; se usa la predeterminada";
  $app.innerHTML = `
    <div class="top"><button class="iconbtn" id="b">${ICON.back}</button><h1 class="title">Ajustes</h1><div style="width:40px"></div></div>
    <div class="set">
      <div class="opt"><label>Palabras nuevas cada 12 h</label><div class="seg" id="seg">${seg}</div>
        <small>Se aplica desde la próxima lección. Las frases están pensadas en grupos de 3.</small></div>
      <div class="opt"><label>Velocidad de la voz · ${state.rate.toFixed(2)}×</label>
        <input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${state.rate}">
        <small>${voice}</small>
        <div class="center"><button class="play" id="test">${ICON.sound} Probar: 你好，我是西班牙人。</button></div></div>
      <div class="opt"><div class="switch">Reproducir audio automáticamente<button class="tg-sw ${state.autoplay ? "on" : ""}" id="ap"></button></div></div>
      <div class="opt"><div class="switch">Pinyin visible antes de destapar<button class="tg-sw ${state.pinyinFirst ? "on" : ""}" id="pf"></button></div>
        <small>Desactivado obliga a leer los caracteres; el pinyin aparece al destapar la traducción.</small></div>
      <div class="opt"><label>Copia de seguridad</label>
        <small style="margin:0">Guarda este código (por ejemplo en Notas) para recuperar tu progreso o pasarlo a otro dispositivo.</small>
        <div class="row2"><button id="exp">Exportar</button><button id="imp">Importar</button></div>
        <div id="bk"></div></div>
      <div class="opt"><label>Progreso</label><small style="margin:0 0 10px">${esc(syncMsg)} · Lección ${state.nextBatch} de ${NBATCH}</small>
        <button class="danger" id="reset">${confirmReset ? "Toca otra vez para borrar todo el progreso" : "Reiniciar progreso"}</button></div>
    </div>`;
  document.getElementById("b").onclick = () => { view = "home"; render(); };
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => { state.perDay = +b.dataset.n; save(); render(); });
  const r = document.getElementById("rate");
  r.oninput = () => { state.rate = +r.value; r.previousElementSibling.textContent = `Velocidad de la voz · ${state.rate.toFixed(2)}×`; };
  r.onchange = () => save();
  document.getElementById("test").onclick = () => speak("你好，我是西班牙人。");
  document.getElementById("ap").onclick = () => { state.autoplay = !state.autoplay; save(); render(); };
  document.getElementById("pf").onclick = () => { state.pinyinFirst = !state.pinyinFirst; save(); render(); };
  document.getElementById("exp").onclick = () => {
    const code = "ZH1:" + btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    const bk = document.getElementById("bk");
    bk.innerHTML = `<textarea id="code" readonly></textarea><div class="row2"><button id="cp">Copiar</button></div><div class="msg" id="m"></div>`;
    const ta = document.getElementById("code"); ta.value = code;
    document.getElementById("cp").onclick = async () => {
      try { await navigator.clipboard.writeText(code); document.getElementById("m").textContent = "Copiado."; }
      catch (e) { ta.focus(); ta.select(); document.getElementById("m").textContent = "Selecciona el texto y cópialo."; }
    };
  };
  document.getElementById("imp").onclick = () => {
    const bk = document.getElementById("bk");
    bk.innerHTML = `<textarea id="code" placeholder="Pega aquí el código"></textarea><div class="row2"><button id="ld">Cargar progreso</button></div><div class="msg" id="m"></div>`;
    document.getElementById("ld").onclick = () => {
      const m = document.getElementById("m");
      try {
        const raw = document.getElementById("code").value.trim();
        if (!raw.startsWith("ZH1:")) throw 0;
        const s = JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));
        if (!s || !s.learned || typeof s.nextBatch !== "number") throw 0;
        state = Object.assign(defaults(), s); save();
        m.style.color = "var(--ok)"; m.textContent = `Cargado: ${learnedIds().length} palabras.`;
      } catch (e) { m.style.color = "var(--accent)"; m.textContent = "El código no es válido."; }
    };
  };
  document.getElementById("reset").onclick = () => {
    if (!confirmReset) { confirmReset = true; render(); return; }
    const keep = {perDay: state.perDay, rate: state.rate, autoplay: state.autoplay, pinyinFirst: state.pinyinFirst};
    state = Object.assign(defaults(), keep); confirmReset = false; save(); view = "home"; render();
  };
}

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && view === "home") render(); });
render();
initSync();
try {
  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname))
    navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
} catch (e) {}
// la lista de voces llega tarde en algunos navegadores
setTimeout(() => { if (view === "home") render(); }, 1200);
setInterval(() => { if (view === "home" && !sheet) render(); }, 60000);
</script>
</body>
</html>
